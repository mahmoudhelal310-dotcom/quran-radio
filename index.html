<body>

<div class="radio-box">
    <div class="creator">by Mahmoud Helal</div>
    <div class="radio-icon">📻</div>
    <h1>إذاعة القرآن الكريم</h1>
    <p>استمع إلى تلاوة عطرة من كتاب الله</p>

    <button id="playBtn" onclick="togglePlay()">▶️ تشغيل الإذاعة</button>

    <!-- زر إضافة للشاشة الرئيسية -->
    <button id="addHomeBtn">📱 إضافة إلى الشاشة الرئيسية</button>

    <audio id="radio" preload="none" playsinline></audio>

    <!-- ===== مؤقت النوم ===== -->
    <div id="sleepTimerBox">

        <label>⏰ مؤقت النوم</label>

        <select id="sleepTime">
            <option value="15">15 دقيقة</option>
            <option value="30">30 دقيقة</option>
            <option value="45">45 دقيقة</option>
            <option value="60">60 دقيقة</option>
            <option value="90">90 دقيقة</option>
        </select>

        <button id="startTimerBtn" onclick="startSleepTimer()">
            ⏰ تشغيل مؤقت النوم

            ❌ إلغاء المؤقت
        </button>

        <div id="timerDisplay"></div>

    </div>

    <!-- رسالة فيسبوك + رابط + زر نسخ -->
    <div id="fbNotice">
        🔊 إذا لم يعمل الصوت داخل فيسبوك  
        🌐 انسخ الرابط وافتحه في أي متصفح:
        <br>
        <a id="fbLink" href="https://mahmoudhelal310-dotcom.github.io/quran-radio/" target="_blank">https://mahmoudhelal310-dotcom.github.io/quran-radio/</a>
        <br>
        <button id="copyBtn">نسخ الرابط</button>
    </div>
</div>

<!-- نافذة تعليمات الآيفون -->
<div id="iosGuideModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center; text-align:center; padding:20px; box-sizing:border-box;">
    <div style="background:#203a43; padding:20px; border-radius:15px; max-width:350px; color:white; border:1px solid #3498db;">
        <h3 style="margin-top:0; color:#ffd700;">طريقة تثبيت التطبيق</h3>

<div style="
  margin:30px auto;
  padding:12px;
  max-width:500px;
  border:1px solid #c8e6c9;
  background:#f1f8e9;
  border-radius:8px;
  text-align:center;
  font-size:18px;
  color:#2e7d32;
  font-weight:bold;
">
🌿 صدقة جارية — لا تنسونا من صالح دعائكم
</div>

<div id="ayah"></div>

<script>
/* ===== تشغيل الإذاعة ===== */
let playing = false;
const radio = document.getElementById("radio");
const btn = document.getElementById("playBtn");
const notice = document.getElementById("fbNotice");

function togglePlay(){
    if(!playing){
        if(!radio.src){
            radio.src = "https://stream.radiojar.com/8s5u5tpdtwzuv";
        }
        radio.load();
        radio.play().then(()=>{
            notice.style.display = "none";
        }).catch(()=>{
            notice.style.display = "block";
        });

        btn.innerHTML = "⏸️ إيقاف الإذاعة";
        playing = true;
    }else{
        radio.pause();
        btn.innerHTML = "▶️ تشغيل الإذاعة";
        playing = false;
    }
}

/* =====================================================
   مؤقت النوم
   ===================================================== */

let sleepTimer = null;
let sleepEndTime = null;

const sleepTime = document.getElementById("sleepTime");
const startTimerBtn = document.getElementById("startTimerBtn");
const cancelTimerBtn = document.getElementById("cancelTimerBtn");
const timerDisplay = document.getElementById("timerDisplay");


function startSleepTimer(){

    if(sleepTimer){
        clearInterval(sleepTimer);
    }

    const minutes = parseInt(sleepTime.value);

    sleepEndTime = Date.now() + (minutes * 60 * 1000);

    timerDisplay.style.display = "block";
    cancelTimerBtn.style.display = "block";

    startTimerBtn.innerHTML = "⏰ إعادة ضبط المؤقت";

    updateSleepTimer();

    sleepTimer = setInterval(updateSleepTimer,1000);
}


function updateSleepTimer(){

    const remaining = sleepEndTime - Date.now();

    if(remaining <= 0){

        clearInterval(sleepTimer);
        sleepTimer = null;

        radio.pause();

        btn.innerHTML = "▶️ تشغيل الإذاعة";
        playing = false;

        timerDisplay.style.display = "none";
        cancelTimerBtn.style.display = "none";

        startTimerBtn.innerHTML = "⏰ تشغيل مؤقت النوم";

        alert("⏰ انتهى مؤقت النوم وتم إيقاف الإذاعة.");

        return;
    }

    const totalSeconds = Math.ceil(remaining / 1000);

    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    let text = "⏰ متبقي: ";

    if(hours > 0){
        text += hours + " ساعة ";
    }

    text += String(minutes).padStart(2,"0");
    text += ":";
    text += String(seconds).padStart(2,"0");

    timerDisplay.innerHTML = text;
}


function cancelSleepTimer(){

    if(sleepTimer){
        clearInterval(sleepTimer);
        sleepTimer = null;
    }

    sleepEndTime = null;

    timerDisplay.style.display = "none";
    cancelTimerBtn.style.display = "none";

    startTimerBtn.innerHTML = "⏰ تشغيل مؤقت النوم";
}


/* ===== نسخ الرابط ===== */
const copyBtn = document.getElementById("copyBtn");
const fbLink = document.getElementById("fbLink");

copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(fbLink.href).then(() => {
        copyBtn.innerText = "تم النسخ ✅";
        setTimeout(() => { copyBtn.innerText = "نسخ الرابط"; }, 2000);
    }).catch(() => {
        alert("فشل النسخ، انسخ الرابط يدويًا");
    });
});


/* ===== الآيات ===== */
const ayat = [
"﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾",
"﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾",
"﴿ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾",
"﴿ فَاذْكُرُونِي أَذْكُرْكُمْ ﴾",
"﴿ هُدًى لِلْمُتَّقِينَ ﴾",
"﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴾",
"﴿ إِنَّ هَذَا الْقُرآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾",
"﴿ وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ ﴾",
"﴿ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ ﴾",
"﴿ قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَى أَنْفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ﴾",
"﴿ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ ﴾",
"﴿ اللَّهُ يَغْفِرُ الذُّنُوبَ جَمِيعًا ﴾",
"﴿ وَمَا يُلْقَاهَا إِلَّا الَّذِينَ صَبَرُوا ﴾",
"﴿ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ ﴾",
"﴿ وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ ﴾",
"﴿ فَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ﴾",
"﴿ رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ ﴾",
"﴿ كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ﴾",
"﴿ إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ لَآيَاتٍ لِلْمُؤْمِنِينَ ﴾",
"﴿ أَفَلَا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ ﴾",
"﴿ أَفَلَا يَتَدَبَّرُونَ الْقُرآنَ ﴾",
"﴿ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ ﴾",
"﴿ إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ ﴾",
"﴿ قُلْ هُوَ اللَّهُ أَحَدٌ ﴾",
"﴿ اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ﴾",
"﴿ وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا ﴾"
];

let currentAyah = 0;
const ayahDiv = document.getElementById("ayah");

function changeAyah(){
    ayahDiv.style.opacity = 0;
    setTimeout(()=>{
        ayahDiv.innerHTML = "📖 " + ayat[currentAyah];
        ayahDiv.style.opacity = 1;
        currentAyah = (currentAyah + 1) % ayat.length;
    },1500);
}

changeAyah();
setInterval(changeAyah,10000);


/* ===== تسجيل Service Worker ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
  .then(() => console.log('Service Worker registered'))
  .catch((err) => console.log('Service Worker failed', err));
}


/* ===== تفعيل زر إضافة الشاشة الرئيسية (يدعم أندرويد وآيفون) ===== */
let deferredPrompt;
const addHomeBtn = document.getElementById('addHomeBtn');
const iosGuideModal = document.getElementById('iosGuideModal');
const guideText = document.getElementById('guideText');

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

if (isIOS) {
    addHomeBtn.style.display = 'block';
    guideText.innerHTML = "لإضافة التطبيق إلى شاشة هاتفك:<br>1. اضغط على زر <b>المشاركة (Share)</b> أسفل المتصفح.<br>2. اختر <b>'إضافة إلى الشاشة الرئيسية' (Add to Home Screen)</b>.";
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    addHomeBtn.style.display = 'block';
});

addHomeBtn.addEventListener('click', () => {
    if (isIOS) {
        iosGuideModal.style.display = 'flex';
    } else if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
                console.log('تم قبول التثبيت');
            }
            deferredPrompt = null;
        });
    } else {
        alert("يمكنك تثبيت الموقع من إعدادات المتصفح لديك (اضغط على النقاط الثلاث واختر إضافة إلى الشاشة الرئيسية).");
    }
});

function closeGuide() {
    iosGuideModal.style.display = 'none';
}
</script>

</body>
</html>
