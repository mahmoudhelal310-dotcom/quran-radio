<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إذاعة القرآن الكريم</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon -->
<link rel="icon" href="favicon.png" type="image/png">

<!-- PWA Manifest خارجي -->
<link rel="manifest" href="manifest.json">

<!-- ===== Google Analytics ===== -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-91HP8NVXK5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-91HP8NVXK5');
</script>

<style>
body{
    margin:0;
    font-family: Tahoma, Arial;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color:white;
    padding:10px;
    height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden; /* منع التمرير نهائياً */
}

.radio-box{
    width: 100%;
    max-width: 380px;
    background: rgba(0,0,0,0.5);
    padding: 15px 20px;
    border-radius: 15px;
    text-align: center;
}

.creator{
    font-size: 14px;
    color: #ffd700;
    font-weight: bold;
    margin-bottom: 5px;
}

.radio-icon{
    font-size: 40px;
    margin-bottom: 5px;
}

h1{
    font-size: 20px;
    margin: 5px 0;
}

p{
    font-size: 13px;
    margin: 0 0 10px 0;
}

/* زر التشغيل وزر التثبيت بحجم أصغر ومناسب */
button{
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #1abc9c;
    color: #000;
    cursor: pointer;
    font-weight: bold;
}

button:active{
    background: #16a085;
}

#addHomeBtn {
    margin-top: 8px;
    background: #3498db;
    color: #fff;
    padding: 8px;
    font-size: 14px;
    display: none; /* يظهر تلقائياً لو متاح */
}

/* ===== مؤقت النوم - مصغر ===== */
#sleepTimerBox{
    margin-top: 8px;
    padding: 6px 8px;
    background: rgba(255,255,255,0.10);
    border-radius: 8px;
}

#sleepTimerBox label{
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    font-weight: bold;
}

#sleepTime{
    width: 100%;
    padding: 5px;
    font-size: 12px;
    border: none;
    border-radius: 6px;
    text-align: center;
    background: #fff;
    color: #222;
}

#startTimerBtn{
    margin-top: 5px;
    padding: 6px;
    font-size: 13px;
    background: #f1c40f;
}

#cancelTimerBtn{
    margin-top: 4px;
    padding: 5px;
    font-size: 12px;
    background: #e74c3c;
    color: white;
    display: none;
}

#timerDisplay{
    margin-top: 4px;
    font-size: 13px;
    font-weight: bold;
    color: #ffd700;
    display: none;
}

#ayah{
    margin: 10px auto;
    padding: 8px;
    max-width: 380px;
    text-align: center;
    font-size: 14px;
    background: #f1f8e9;
    color: #2e7d32;
    border-radius: 8px;
    font-weight: bold;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

#fbNotice{
    display: none;
    margin-top: 8px;
    padding: 8px;
    background: #fff3cd;
    color: #000;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    word-break: break-word;
}

#fbNotice a{
    display: block;
    margin-top: 4px;
    padding: 5px;
    background: #1abc9c;
    color: #000;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
}

#copyBtn{
    display: inline-block;
    margin-top: 4px;
    padding: 5px 10px;
    background: #1abc9c;
    color: #000;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="radio-box">
    <div class="creator">by Mahmoud Helal</div>
    <div class="radio-icon">📻</div>
    <h1>إذاعة القرآن الكريم</h1>
    <p>استمع إلى تلاوة عطرة من كتاب الله</p>

    <button id="playBtn" onclick="togglePlay()">▶️ تشغيل الإذاعة</button>

    <!-- زر تثبيت التطبيق المصغر -->
    <button id="addHomeBtn">📱 تثبيت التطبيق</button>

    <audio id="radio" preload="none" playsinline></audio>

    <!-- ===== مؤقت النوم ===== -->
    <div id="sleepTimerBox">
        <label>⏰ مؤقت النوم</label>
        <select id="sleepTime">
            <option value="15">15 دقيقة</option>
            <option value="30">30 دقيقة</option>
            <option value="45">45 دقيقة</option>
            <option value="60">60 دقيقة</option>
            <option value="90">90 دقيقة</option>
        </select>
        <button id="startTimerBtn" onclick="startSleepTimer()">⏰ تشغيل المؤقت</button>
        <button id="cancelTimerBtn" onclick="cancelSleepTimer()">❌ إلغاء</button>
        <div id="timerDisplay"></div>
    </div>

    <!-- رسالة فيسبوك -->
    <div id="fbNotice">
        🔊 لم يعمل الصوت؟ افتحه بمتصفح خارجي:
        <a id="fbLink" href="https://mahmoudhelal310-dotcom.github.io/quran-radio/" target="_blank">رابط الإذاعة</a>
        <button id="copyBtn">نسخ الرابط</button>
    </div>
</div>

<div style="
  margin: 8px auto 0 auto;
  padding: 6px;
  max-width: 380px;
  border: 1px solid #c8e6c9;
  background: #f1f8e9;
  border-radius: 6px;
  text-align: center;
  font-size: 13px;
  color: #2e7d32;
  font-weight: bold;
">
🌿 صدقة جارية — لا تنسونا من صالح دعائكم
</div>

<div id="ayah"></div>

<script>
/* ===== تشغيل الإذاعة ===== */
let playing = false;
const radio = document.getElementById("radio");
const btn = document.getElementById("playBtn");
const notice = document.getElementById("fbNotice");

function togglePlay(){
    if(!playing){
        if(!radio.src){
            radio.src = "https://stream.radiojar.com/8s5u5tpdtwzuv";
        }
        radio.load();
        radio.play().then(()=>{
            notice.style.display = "none";
        }).catch(()=>{
            notice.style.display = "block";
        });

        btn.innerHTML = "⏸️ إيقاف الإذاعة";
        playing = true;
    }else{
        radio.pause();
        btn.innerHTML = "▶️ تشغيل الإذاعة";
        playing = false;
    }
}

/* ===== مؤقت النوم ===== */
let sleepTimer = null;
let sleepEndTime = null;
const sleepTime = document.getElementById("sleepTime");
const startTimerBtn = document.getElementById("startTimerBtn");
const cancelTimerBtn = document.getElementById("cancelTimerBtn");
const timerDisplay = document.getElementById("timerDisplay");

function startSleepTimer(){
    if(sleepTimer){ clearInterval(sleepTimer); }
    const minutes = parseInt(sleepTime.value);
    sleepEndTime = Date.now() + (minutes * 60 * 1000);
    timerDisplay.style.display = "block";
    cancelTimerBtn.style.display = "block";
    startTimerBtn.innerHTML = "⏰ إعادة ضبط";
    updateSleepTimer();
    sleepTimer = setInterval(updateSleepTimer,1000);
}

function updateSleepTimer(){
    const remaining = sleepEndTime - Date.now();
    if(remaining <= 0){
        clearInterval(sleepTimer);
        sleepTimer = null;
        radio.pause();
        btn.innerHTML = "▶️ تشغيل الإذاعة";
        playing = false;
        timerDisplay.style.display = "none";
        cancelTimerBtn.style.display = "none";
        startTimerBtn.innerHTML = "⏰ تشغيل المؤقت";
        alert("⏰ انتهى مؤقت النوم وتم إيقاف الإذاعة.");
        return;
    }
    const totalSeconds = Math.ceil(remaining / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    let text = "⏰ متبقي: ";
    if(hours > 0){ text += hours + " س "; }
    text += String(minutes).padStart(2,"0") + ":" + String(seconds).padStart(2,"0");
    timerDisplay.innerHTML = text;
}

function cancelSleepTimer(){
    if(sleepTimer){ clearInterval(sleepTimer); sleepTimer = null; }
    sleepEndTime = null;
    timerDisplay.style.display = "none";
    cancelTimerBtn.style.display = "none";
    startTimerBtn.innerHTML = "⏰ تشغيل المؤقت";
}

/* ===== نسخ الرابط ===== */
const copyBtn = document.getElementById("copyBtn");
const fbLink = document.getElementById("fbLink");
copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(fbLink.href).then(() => {
        copyBtn.innerText = "تم ✅";
        setTimeout(() => { copyBtn.innerText = "نسخ الرابط"; }, 2000);
    });
});

/* ===== الآيات ===== */
const ayat = [
"﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾",
"﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾",
"﴿ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾",
"﴿ فَاذْكُرُونِي أَذْكُرْكُمْ ﴾",
"﴿ هُدًى لِلْمُتَّقِينَ ﴾",
"﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴾",
"﴿ إِنَّ هَذَا الْقُرآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾",
"﴿ وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ ﴾",
"﴿ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ ﴾"
];

let currentAyah = 0;
const ayahDiv = document.getElementById("ayah");

function changeAyah(){
    ayahDiv.style.opacity = 0;
    setTimeout(()=>{
        ayahDiv.innerHTML = "📖 " + ayat[currentAyah];
        ayahDiv.style.opacity = 1;
        currentAyah = (currentAyah + 1) % ayat.length;
    },1000);
}

changeAyah();
setInterval(changeAyah,8000);

/* ===== تسجيل Service Worker وتثبيت التطبيق ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

let deferredPrompt;
const addHomeBtn = document.getElementById('addHomeBtn');

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    addHomeBtn.style.display = 'block'; // يظهر الزر تلقائياً وبشكل مباشر
});

addHomeBtn.addEventListener('click', () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
                addHomeBtn.style.display = 'none';
            }
            deferredPrompt = null;
        });
    }
});
</script>

</body>
</html>
